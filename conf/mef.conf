[global]
# Directory containing enabled per-service rule files (*.conf)
rules_dir=/etc/mef/rules.d

# Directory containing whitelist entries (*.conf)
whitelist_dir=/etc/mef/whitelist

# Check whitelist file changes periodically and reload changed entries (supports duration like 10s/1m or seconds)
whitelist_reload=1m

# Debug log output path (MVP: match/action output)
debug_log=/tmp/mef.txt

# journalctl --since value for journal sources
journal_since=2 min ago
# journalctl mode: all (full journal)
journal_mode=all

# Firewall settings
# backend: auto | nftables | iptables
firewall_backend=auto
# nftables table/chain settings (only used for nftables backend)
firewall_family=inet
firewall_table=mef
firewall_chain=mef
firewall_hook=input
firewall_priority=-100

# Firewall logging
firewall_log_enabled=true
firewall_log_prefix=MEF DROP 
firewall_log_level=warn
