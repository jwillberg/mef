[global]
# ---- Directories ----
# Directory containing enabled per-service rule files (*.conf)
rules_dir=/etc/mef/rules.d

# Directory containing whitelist entries (*.conf)
whitelist_dir=/etc/mef/whitelist

# Directory containing permanent blacklist entries (*.conf)
blacklist_dir=/etc/mef/blacklist

# Directory containing daemon cache/state files (e.g. recidive counters)
cache_dir=/etc/mef/cache

# ---- Reload Intervals ----
# Check whitelist file changes periodically and reload changed entries (supports duration like 10s/1m or seconds)
whitelist_reload=1m

# Check blacklist file changes periodically and reload changed entries
# Mapping:
#   auto-permanent.conf -> mefpermbanned_v4/v6
#   other *.conf files  -> mefbl_<filename>_v4/v6
# Reload is file-granular; unchanged files are skipped.
blacklist_reload=1m

# ---- Permanent Blacklist Fastpath (Linux) ----
# Fast drop path for permanent blacklist IPs (mefpermbanned_* + mefbl_*).
# This is an acceleration layer in front of normal firewall backend.
# auto: try xdp, then tc, then disabled.
# Inspect runtime state: mefctl status --verbose fastpath
# Inspect kernel fastpath entries: mefctl bans list --fastpath --ips-only
blacklist_fastpath=auto

# XDP mode preference when XDP is selected:
# auto | native | generic
blacklist_fastpath_xdp_mode=auto

# ---- Logging ----
# Enable debug logging (true/false, default false)
debug=false

# Debug log output path (only used if debug=true)
debug_log=/tmp/mef.txt

# Enable BAN event logging (true/false, default false)
ban_log_enabled=false

# Ban log output path (used if ban_log_enabled=true)
ban_log_path=/var/log/mef.log

# ---- Community Reporting ----
# Optional community reporting for structured ban indicators (default false)
# Sends hashed reporter id + attacker IP + service + timestamp as JSON batches.
# Delivery is best-effort and fully non-blocking for local ban logic.
# Uses built-in cloud endpoint.
community_report=false

# ---- Community Cloud Protection (DNS) ----
# Optional cloud protection (requires community_report=true).
# Uses Malware.Expert DNS cloud check (RULE=CLOUD, SOURCE=DNS).
community_cloud_protection=false

# Cloud DNS protection tuning (applies when community_cloud_protection=true):
# ports: all | 22,443 | 100-2000
community_cloud_ports=all
community_cloud_bantime=1h
community_cloud_timeout=2s
community_cloud_positive_ttl=1h
community_cloud_negative_ttl=15m
community_cloud_error_ttl=30s

# ---- RBL (DNSBL) ----
# Optional RBL (DNSBL) detection (Linux packet/conntrack/journal source pipeline)
# Uses ps_source_order / ps_packet_udp / ps_interface / ps_interface_exclude for event source filtering.
# Note: Malware.Expert cloud DNS protection is configured via community_cloud_protection.
rbl_enabled=false

# Dynamic RBL profile syntax: rbl_<key>_<field>, where <key> uses [a-z0-9]+
# Default profile key: blocklist
rbl_blocklist_enabled=true
rbl_blocklist_zone=bl.blocklist.de
rbl_blocklist_answer_match=127.0.0.*,127.*,*
rbl_blocklist_ports=all
rbl_blocklist_bantime=1h
rbl_blocklist_timeout=2s
rbl_blocklist_positive_ttl=1h
rbl_blocklist_negative_ttl=15m
rbl_blocklist_error_ttl=30s

# ---- Runtime Behavior ----
# Clear active bans when mefdaemon stops (true/false, default false)
clear_bans_on_stop=false

# journalctl --since value for journal sources
journal_since=2 min ago

# journalctl mode: all (full journal)
journal_mode=all

# ---- Port Scan Detection (PS) ----
# Ban IP when it hits more than ps_limit different destination ports
# inside ps_interval window (Linux only in v1).
ps_enabled=true
ps_limit=5
ps_interval=300
ps_bantime=3600

# Interface filter for PS source events:
#   auto           = detect internet-facing interface(s) from default route
#   eth0           = single interface
#   eth0,eth1      = multiple interfaces
ps_interface=auto

# Optional interface exclude list for PS source events:
#   lo             = single interface exclude
#   lo,eth1        = multiple interface excludes
ps_interface_exclude=lo

# Source preference order: packet,conntrack,journal
# packet = raw kernel packet socket (TCP SYN without ACK, requires CAP_NET_RAW)
# IMPORTANT CPU note:
# - packet gives best visibility but highest userspace CPU under traffic/flood.
# - conntrack is much lighter (NEW flow events), but sees less than packet.
# - this order is shared by PS and RBL/CLOUD event collection.
# - even with ps_enabled=false, packet source can stay active when rbl_enabled=true.
# - with conntrack + ps_exclude_ports=auto, scan visibility may become very low
#   because local listening service ports are auto-excluded from PS counting.
ps_source_order=packet,conntrack,journal

# Include UDP packets in packet source PS tracking (true/false, default false)
# When enabled, mefdaemon auto-manages /etc/mef/whitelist/auto-whitelist.conf
# with detected DNS resolvers, default gateways, and DHCP server addresses.
ps_packet_udp=false

# Enable packet-source kernel blocked-IP drop path (true/false, default true).
# This is independent from blacklist_fastpath (xdp/tc) and applies only when
# packet source is active in ps_source_order.
ps_packet_kernel_drop=true

# Packet-source receive mode:
# - auto     = try PACKET_MMAP/TPACKET_V3 first, fallback to recvfrom
# - mmap     = require PACKET_MMAP/TPACKET_V3 ring path
# - recvfrom = classic recvfrom socket loop
# default keeps legacy/stable behavior (mmap is opt-in)
ps_packet_rx_mode=auto

# Number of packet sockets per interface when packet source is active.
# - 1  = single socket (default)
# - >1 = enable PACKET_FANOUT hash distribution across sockets
# - valid range: 1..64
ps_packet_fanout_sockets=1

# Conntrack netlink socket buffer size in bytes (increase if ENOBUFS appears)
ps_conntrack_buffer_size=8388608

# Emit periodic PS statistics to service log (true/false)
ps_stats=true

# PS stats log interval (supports duration like 30s/1m/5m or integer seconds)
ps_stats_interval=300s

# Exclude ports from PS tracking:
#   auto                = auto-detect listening server ports (tcp+udp)
#   22,443,100-500      = manual list/ranges
#   auto,22,443         = auto + manual add-ons
ps_exclude_ports=auto

# Auto-detected exclude port refresh interval
ps_exclude_ports_refresh=1m

# Optional second stage (permanent blacklist escalation)
ps_escalation_enabled=true
ps_escalation_window=24h
ps_permanent_threshold=3

# ---- File Source Bootstrap (source=file) ----
# Track only the most recent files at startup to avoid opening old archives.
# Set limit=0 and/or window=0 to disable filtering.
file_recent_limit=200
file_recent_window=24h

# ---- Firewall ----
# Backend: auto | nftables | iptables
firewall_backend=auto

# nftables table/chain settings (only used for nftables backend)
# NOTE: mefdaemon uses chain "mef_input" for ban rules
# NOTE: mefctl rules use "mef_policy_*" chains for policy rules (no conflict)
firewall_family=inet
firewall_table=mef
firewall_chain=mef
firewall_hook=input
firewall_priority=0

# ---- Firewall Logging ----
firewall_log_enabled=true
firewall_log_prefix=MEF_
firewall_log_level=warn
# Firewall log rate-limit (protects kernel/journal under flood):
# - rate is logs per second
# - burst is token bucket burst size
# - scope is per firewall LOG rule (not per source IP)
# - lower values reduce CPU/journal pressure during flood
# - DROP is still unconditional; only logging is limited
firewall_log_rate=1
firewall_log_burst=5

# ---- DDoS Guard (Two-Stage: kernel throttle + daemon escalation) ----
# Stage 1 (kernel): backend-native soft throttle rules per configured destination port.
# - mode is controlled by ddos_stage1_mode (throttle|drop)
# Stage 2 (daemon): polls kernel throttle set state and escalates repeated offenders
# to normal runtime bans (RULE=DDOS, SOURCE=KERNEL). No kernel log parsing required.
# Recommended:
# - keep disabled until thresholds are tuned for your traffic
# - enable only for internet-facing open service ports
# - baseline start: 80,443 (add 22/25/465/587 only if those are publicly exposed)
# ddos_enabled:
# - true  = DDOS guard active (Stage 1 + Stage 2)
# - false = DDOS guard disabled
ddos_enabled=false

# ddos_ports:
# - destination service ports to protect
# - only traffic to these ports is counted by DDOS guard
# - example: 80,443 protects HTTP/HTTPS only
ddos_ports=80,443

# ddos_syn_rate:
# - per source IP, per protected port
# - allowed NEW TCP SYN events per second before Stage 1 throttle
ddos_syn_rate=100

# ddos_syn_burst:
# - short spike allowance for SYN rate (packet count, no time unit)
# - higher value tolerates short bursts before throttle
ddos_syn_burst=200

# ddos_newconn_rate:
# - per source IP, per protected port
# - allowed NEW connections per second before Stage 1 throttle
ddos_newconn_rate=60

# ddos_newconn_burst:
# - short spike allowance for new-connection rate (count, no time unit)
ddos_newconn_burst=120

# ddos_connlimit:
# - per source IP, per protected port
# - maximum concurrent connections before Stage 1 throttle
ddos_connlimit=80

# ddos_stage1_mode:
# - throttle = soft throttle (drop only over-limit packets/connections, allow in-limit traffic)
# - drop     = hard temporary drop (when IP enters throttle set, all traffic from IP is dropped until stage1 timeout)
# Note:
# - Stage 2 escalation can work in both modes, because both modes write offenders to throttle set.
ddos_stage1_mode=throttle

# ddos_stage1_timeout:
# - timeout for Stage 1 throttle-set membership
# - controls how long source stays in Stage 1 state after latest over-limit hit
# - if ddos_stage1_mode=drop, this is also full-drop duration (refreshed on new over-limit hit)
ddos_stage1_timeout=10m

# ddos_poll_interval:
# - Stage 2 daemon poll cadence for reading DDOS throttle kernel sets
# - lower value = faster reaction but higher CPU/command overhead
# - higher value = lower CPU overhead but slower Stage 2/log visibility
ddos_poll_interval=5s

# ddos_signal_details_enabled:
# - true  = Stage 1 stores per-hit metric+port detail sets for richer DDOS log msg context
# - false = disable detail-set writes/reads to reduce kernel + daemon overhead
#          (DDOS still works; msg falls back to signals=disabled)
ddos_signal_details_enabled=true

# ddos_escalation_enabled:
# - true  = Stage 2 escalation enabled (throttle episodes can become runtime bans)
# - false = Stage 2 escalation disabled (DDOS stays throttle/drop only, no runtime DDOS ban)
ddos_escalation_enabled=true

# ddos_escalation_window:
# - time window used to count repeated Stage 1 throttle episodes
# - example: 10m
ddos_escalation_window=10m

# ddos_escalation_hits:
# - if same source IP reaches this many throttle episodes inside window,
#   Stage 2 runtime ban is applied
# - "throttle_hits" in DDOS log means episode counter (source enters throttle state),
#   not per-packet counter
ddos_escalation_hits=3

# ddos_bantime:
# - Stage 2 runtime ban duration
# - example: 1h means ban expires automatically after one hour
# - special value: permanent (adds IP to persistent blacklist)
ddos_bantime=1h

# Optional per-port overrides:
# ddos_port_<port>_syn_rate=<int>        # per-second (1/s)
# ddos_port_<port>_syn_burst=<int>       # burst count
# ddos_port_<port>_newconn_rate=<int>    # per-second (1/s)
# ddos_port_<port>_newconn_burst=<int>   # burst count
# ddos_port_<port>_connlimit=<int>       # concurrent count
# Example:
# ddos_port_22_syn_rate=40
# ddos_port_22_syn_burst=80
# ddos_port_22_newconn_rate=20
# ddos_port_22_newconn_burst=40
# ddos_port_22_connlimit=20
