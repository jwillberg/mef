[global]
# Directory containing enabled per-service rule files (*.conf)
rules_dir=/etc/mef/rules.d

# Directory containing whitelist entries (*.conf)
whitelist_dir=/etc/mef/whitelist

# Directory containing permanent blacklist entries (*.conf)
blacklist_dir=/etc/mef/blacklist

# Directory containing daemon cache/state files (e.g. recidive counters)
cache_dir=/etc/mef/cache

# Check whitelist file changes periodically and reload changed entries (supports duration like 10s/1m or seconds)
whitelist_reload=1m
# Check blacklist file changes periodically and reload changed entries
blacklist_reload=1m

# Enable debug logging (true/false, default false)
debug=false
# Debug log output path (only used if debug=true)
debug_log=/tmp/mef.txt

# Enable BAN event logging (true/false, default false)
ban_log_enabled=false
# Ban log output path (used if ban_log_enabled=true)
ban_log_path=/var/log/mef.log
# Clear active bans when mefdaemon stops (true/false, default false)
clear_bans_on_stop=false

# journalctl --since value for journal sources
journal_since=2 min ago
# journalctl mode: all (full journal)
journal_mode=all

# Port Scan Detection (PS)
# Ban IP when it hits more than ps_limit different destination ports
# inside ps_interval window (Linux only in v1).
ps_enabled=true
ps_limit=5
ps_interval=300
ps_bantime=3600
# Interface filter for PS source events:
#   auto           = detect internet-facing interface(s) from default route
#   eth0           = single interface
#   eth0,eth1      = multiple interfaces
ps_interface=auto
# Optional interface exclude list for PS source events:
#   lo             = single interface exclude
#   lo,eth1        = multiple interface excludes
ps_interface_exclude=lo
# Emit periodic PS statistics to service log (true/false)
ps_stats=true
# PS stats log interval (supports duration like 30s/1m/5m or integer seconds)
ps_stats_interval=300s
# Exclude ports from PS tracking:
#   auto                = auto-detect listening server ports (tcp+udp)
#   22,443,100-500      = manual list/ranges
#   auto,22,443         = auto + manual add-ons
ps_exclude_ports=auto
# Auto-detected exclude port refresh interval
ps_exclude_ports_refresh=1m
# Conntrack netlink socket buffer size in bytes (increase if ENOBUFS appears)
ps_conntrack_buffer_size=8388608
# Source preference order: packet,conntrack,journal
# packet = raw kernel packet socket (TCP SYN without ACK, requires CAP_NET_RAW)
ps_source_order=packet,conntrack,journal
# Include UDP packets in packet source PS tracking (true/false, default false)
ps_packet_udp=false
# Optional second stage (permanent blacklist escalation)
ps_escalation_enabled=true
ps_escalation_window=24h
ps_permanent_threshold=3

# File source bootstrap controls (source=file):
# Track only the most recent files at startup to avoid opening old archives.
# Set limit=0 and/or window=0 to disable filtering.
file_recent_limit=200
file_recent_window=24h

# Firewall settings (mefdaemon - auto-banning)
# backend: auto | nftables | iptables
firewall_backend=auto
# nftables table/chain settings (only used for nftables backend)
# NOTE: mefdaemon uses chain "mef_input" for ban rules
# NOTE: mefctl rules use "mef_policy_*" chains for policy rules (no conflict)
firewall_family=inet
firewall_table=mef
firewall_chain=mef
firewall_hook=input
firewall_priority=0

# Firewall logging
firewall_log_enabled=true
firewall_log_prefix=MEF_
firewall_log_level=warn
