# WebScan HTTP Episode Detection Rule
#
# This rule detects HTTP reconnaissance and scanning activity by aggregating
# requests from the same source IP across multiple time windows (sliding windows).
#
# Key concept: Instead of matching individual log lines, WebScan tracks per-IP
# request patterns: unique paths, User-Agent diversity, HTTP status distribution.
#
# Usage:
#   1. Enable this rule: enabled=true
#   2. Set files: paths to HTTP access logs (supports globs)
#   3. Configure failregex: must extract ip, uri, status, ua with named groups
#   4. Define thresholds: rule_N_* fields trigger ban/detect actions
#
# Requirements:
#   - HTTP access logs (nginx, apache, litespeed, etc.)
#   - engine=webscan marker (differentiates from traditional pattern matching)
#   - Named capture groups in failregex: (?P<ip>...), (?P<uri>...), (?P<status>...), (?P<ua>...)

[rule]
# Enable/disable this rule (true/false)
enabled=false

# Descriptive name (can have multiple webscan rules: webscan-prod, webscan-staging, etc)
name=webscan

# Engine type: "webscan" (HTTP episode aggregator, not traditional log matcher)
engine=webscan

# Input source: file (HTTP access logs)
source=file

# File paths (supports shell glob patterns; processed by `tail -F` subprocess)
# Glob: * = any characters in single path component (e.g., /var/log/nginx/*/access.log matches /var/log/nginx/default/access.log)
# Multiple patterns: comma-separated (e.g., /var/log/nginx/*.log,/var/log/apache2/*.log)
# Dynamic files: new files matching glob are automatically detected and followed (no restart needed)
#
# Examples:
#   - /var/log/nginx/access.log                    (single fixed file)
#   - /var/log/nginx/*.log                         (all .log files in directory)
#   - /var/log/nginx/*access.log                   (all access.log variants: default_access.log, domain_access.log, etc)
#   - /var/log/nginx/*/access.log                  (per-vhost: /var/log/nginx/site1/access.log, /var/log/nginx/site2/access.log, etc)
#   - /var/log/nginx/*/access.log,/var/log/apache2/*.log   (multiple servers)
#
# Note: glob patterns are evaluated by shell `tail -F` command, not by MEF code.
#       New files matching pattern are followed immediately after creation.
files=/var/log/nginx/*access.log

# ============================================================================
# DETECTION: HTTP Log Parsing
# ============================================================================
#
# WebScan extracts the following fields from each log line:
#   (?P<ip>...)      → source IP address (IPv4 or IPv6)
#   (?P<method>...)  → HTTP method (GET, POST, PUT, DELETE, etc) [captured but not used in thresholds]
#   (?P<uri>...)     → request path (query strings will be stripped)
#   (?P<status>...)  → HTTP status code (200, 404, 403, 429, etc)
#   referer          → referrer header [captured but not used in thresholds]
#   (?P<ua>...)      → User-Agent string (may be empty or "-")
#
# Used for aggregation and threshold matching: ip, uri, status, ua
# Captured but not evaluated: method, referer
# The regex should extract ONLY valid requests (not empty/null fields).

[detection]

# Combined Log Format (CLF) — used by nginx, Apache, and LiteSpeed by default:
# IP - - [timestamp] "METHOD /path?query HTTP/version" status bytes "referer" "user-agent"
#
# Examples (all matched by the same failregex):
#
# nginx:
# 34.22.59.168 - - [26/Jul/2026:09:29:29 +0000] "GET /nginx_status HTTP/2.0" 404 0 "-" "Mozilla/5.0 (compatible; GPTBot/1.3)"
#
# Apache:
# 45.156.128.126 - - [26/Jul/2026:11:00:28 +0000] "GET / HTTP/1.1" 200 4052 "-" "Mozilla/5.0 Chrome/123.0"
#
# LiteSpeed (query string is stripped from uri capture group):
# 185.190.142.132 - - [26/Jul/2026:10:58:45 +0000] "GET /index.php?s=/think/invokefunction HTTP/1.1" 404 1251 "-" "libredtail-http"
#
# Regex explanation:
#   ^(?P<ip>\S+)                        → IP address (start of line)
#   \s+\S+\s+\S+\s+                     → skip [- -] (ident, user)
#   \[[^\]]+\]\s+                       → skip [timestamp]
#   "(?P<method>\S+)\s+(?P<uri>[^\s?]+) → extract METHOD and URI (without query string)
#   (?:\?[^\s]*)?\s+HTTP/[0-9.]+"\s+    → skip query string and HTTP version
#   (?P<status>\d+)\s+\d+\s+            → extract status code, skip bytes
#   "[^"]*"\s+                          → skip referer (captured but not used)
#   "(?P<ua>[^"]*)"\s*$                 → extract User-Agent (end of line)
#
# Captured fields used in thresholds: ip, uri, status, ua
# Captured fields not used: method (could be used for method-based filtering in v3)
# Skipped fields: ident, user, timestamp, bytes, referer

failregex=^(?P<ip>\S+)\s+\S+\s+\S+\s+\[[^\]]+\]\s+"(?P<method>\S+)\s+(?P<uri>[^\s?]+)(?:\?[^\s]*)?\s+HTTP/[0-9.]+"\s+(?P<status>\d+)\s+\d+\s+"[^"]*"\s+"(?P<ua>[^"]*)"\s*$

# ============================================================================
# WEBSCAN: Episode Aggregation Parameters
# ============================================================================
#
# WebScan maintains per-IP sliding windows that track:
#   - requests: total HTTP requests
#   - unique_uri: count of distinct request paths
#   - unique_ua: count of distinct User-Agent strings
#   - status_code: breakdown of HTTP response codes
#
# Multiple windows allow capturing both fast and slow attacks:
#   - 60s: aggressive/burst scans (automated tools)
#   - 300s: patient reconnaissance (manual, distributed)

[webscan]

# Sliding time windows (comma-separated duration format)
# Each window maintains separate per-IP state and evaluates thresholds independently
# Thresholds can target specific windows via rule_N_window=60s or rule_N_window=300s
#
# Duration format: number + unit (s=seconds, m=minutes, h=hours)
#   Examples: 30s, 60s, 5m, 10m, 1h, 24h
#   Typical: 60s (burst/aggressive attacks), 300s (5min, patient recon), 3600s (hourly patterns)
#   Shorter windows (30s): detect very rapid attacks (false positive risk for legitimate bursts)
#   Longer windows (1h+): slower reconnaissance (higher latency, higher data retention, fewer bans)
#
# Common patterns:
#   windows=60s,300s          ← recommended for mixed attack types (bursts + slow scans)
#   windows=60s               ← focus on aggressive scanners only (fewer tuning knobs)
#   windows=30s,60s,300s      ← aggressive (3 windows, more memory, 3x rule evaluations)
windows=60s,300s

# Hash saturation limits (bounded memory per IP per window)
# When a set exceeds this limit, use LRU eviction: keep only the N most recent entries
# Older/least-recently-seen entries are dropped to maintain bounded memory while preserving accuracy
#
# Sizing guidance:
#   - Normal web traffic: uri_hash_limit=500–1000, ua_hash_limit=50–200
#   - High-traffic sites (1M+ req/day): uri_hash_limit=5000, ua_hash_limit=500
#   - CDN/proxy (very diverse UA from few IPs): ua_hash_limit=1000+
#   - Single-origin API clients: uri_hash_limit=100, ua_hash_limit=20
#
# Trade-off: higher limits = better accuracy (don't evict real diversity) but more memory/CPU per IP
#   Lower limits = faster hashset ops, less memory, but risk losing real diverse scanning patterns
#
# Typical for Apache/nginx user traffic (normal sites):
uri_hash_limit=1000        # max unique paths before LRU eviction (keep 1000 most recent)
ua_hash_limit=500          # max unique User-Agents before LRU eviction (keep 500 most recent)

# Global state limits (per rule, applies to all windows combined)
# Prevents unbounded memory growth under sustained attack
#
# Sizing guidance:
#   - Small deployment (<1000 concurrent clients): max_active_ips=1000–2000
#   - Medium (1000–10k concurrent): max_active_ips=10000
#   - Large (10k+ concurrent): max_active_ips=100000+ (depends on available RAM)
#   - Heavily attacked site: max_active_ips=50000+ (expect many distinct attackers)
#
# Expiration triggers:
#   - IP expires after ip_inactivity_timeout (default 5m) with no requests → freed immediately
#   - When max_active_ips exceeded, least-recently-active IP is evicted first (LRU per IP)
#
max_active_ips=10000       # track at most 10k active IPs simultaneously (scales per available RAM)
ip_inactivity_timeout=5m   # expire IP if no requests for 5 minutes (free memory, reset counters)

# ============================================================================
# THRESHOLDS: Attack Detection Rules
# ============================================================================
#
# Each threshold rule uses direct capture group names and time windows:
#   requests_min       ← total HTTP requests (any status code)
#   uri_count_min      ← unique paths detected (derived from (?P<uri>...) hashing)
#   ua_count_min       ← unique User-Agents (derived from (?P<ua>...) hashing; can be 0 or "-")
#   status_code        ← HTTP status FILTER: match only requests matching pattern (see examples below)
#   status_threshold   ← when status_code is set, min count of requests matching that filter
#   window             ← which time window: MUST match one of windows= entries (e.g. 60s, 300s)
#   action             ← ban or detect (audit mode)
#   bantime            ← duration to block IP (format: 60s, 300s, 3600s, 24h, etc)
#
# Logic: ALL conditions must match (AND logic, not OR)
#   Example: if rule_N_requests_min=10 AND rule_N_uri_count_min=5 AND rule_N_status_threshold=8
#   → trigger only if ALL three are true simultaneously
#
# ============================================================================
# Status Code Patterns (status_code field)
# ============================================================================
#
# Exact status:
#   200                → only HTTP 200 (success)
#   404                → only HTTP 404 (not found)
#   403                → only HTTP 403 (forbidden)
#
# Status ranges (all matching codes in range):
#   2xx                → all 2xx codes (200-299, includes 201, 204, 206, etc)
#   3xx                → all 3xx codes (300-399, includes 301, 302, 307, 308, etc)
#   4xx                → all 4xx codes (400-499, includes 400, 401, 403, 404, 429, etc)
#   5xx                → all 5xx codes (500-599, includes 500, 502, 503, 504, etc)
#
# Multiple patterns (OR logic, match ANY of these):
#   404,403            → either 404 OR 403 (both count toward threshold)
#   404,500,502        → 404 OR 500 OR 502 (mix of ranges and exact)
#   4xx,5xx            → all errors (both client + server errors)
#   3xx,4xx,5xx        → non-2xx (common for scanning/errors)
#   200,404,403        → any mix of codes
#
# Wildcard (match all):
#   *                  → any status code (200, 404, 500, etc all count)
#
# Special: omit status_code field
#   If status_code is not specified → all requests count regardless of status
#   Same as status_code=*
#
# Common filtering patterns:
#   - Scanning (probing): status_code=3xx,4xx,5xx (errors common in scans)
#   - Error enumeration: status_code=404 (directory brute-force)
#   - Auth probing: status_code=401,403 (protected resources)
#   - DDoS: status_code=200 (volumetric, often successful hits)
#   - Volumetric catch-all: status_code=* (any response)

# ============================================================================
# Bantime Durations (bantime field)
# ============================================================================
#
# Format: number + unit (s, m, h)
#   60s    → 1 minute
#   300s   → 5 minutes
#   600s   → 10 minutes
#   3600s  → 1 hour
#   86400s → 24 hours
#   1m     → 1 minute (same as 60s)
#   5m     → 5 minutes (same as 300s)
#   1h     → 1 hour (same as 3600s)
#   24h    → 24 hours (same as 86400s)
#   7d     → 7 days (168 hours)
#
# Common strategies:
#   - Aggressive scanners (high confidence): bantime=3600s (1 hour)
#   - Error probes (medium confidence): bantime=600s (10 min, shorter cool-off)
#   - Volume spikes (low confidence): bantime=300s (5 min, audit only)
#   - Repeat offenders (escalation): bantime=86400s (24h, enforce learning)

[thresholds]

# Rule 1: Rotating Crawler Signatures (evasion pattern, 60s window)
#   Detects: rotating User-Agents + error responses = automated reconnaissance with UA evasion
#   Pattern: 10+ requests, 5+ different User-Agents, 8+ returning non-2xx in 60s
#   Why 3xx,4xx,5xx filter: scanners hit wrong paths (404s, 403s, redirects) while legitimate bots
#   have 2xx dominant traffic (search indexing = mostly successful loads)
#   Examples: ChatGPT-User + OAI-SearchBot + GPTBot rotating, DiffBot + Applebot mix
#
# Tuning for your site:
#   - requests_min: adjust based on your typical asset load per request
#     * low (10): conservative, catches many scanners, risk of false positives from CDN
#     * medium (20–30): balanced, most attacks caught, few false positives
#     * high (50+): only very aggressive attacks, misses patient scans
#   - ua_count_min: how many different User-Agents trigger?
#     * low (3): catches rotating bots easily, high false positive (auth token expiry → UA changes)
#     * medium (5–7): recommended, most bots have 5+ UAs in 60s
#     * high (10+): only highly coordinated multi-UA attacks
#   - Disable: set action=detect first, monitor ban logs for false positives
rule_1_name=rotating_crawlers
rule_1_requests_min=10
rule_1_ua_count_min=5
rule_1_status_code=3xx,4xx,5xx
rule_1_status_threshold=8
rule_1_window=60s
rule_1_action=ban
rule_1_bantime=3600

# Rule 2: Credential/Secret Scanner (single or multi-UA, 300s window)
#   Detects: systematic scanning of many different paths with error-dominant responses
#   Pattern: 20+ requests, 15+ unique URIs, 15+ returning non-2xx (3xx/4xx/5xx) in 300s
#   Covers two attack sub-types:
#     - Fast burst (GPTBot-style): 95 requests in 12s → caught well within 300s window
#     - Slow recon (patient scanner): 20+ req/300s, rotating paths, mostly errors
#   Why NOT 404,403 only: 3xx (redirects to auth) and 5xx (probing misconfigured endpoints)
#   also indicate scanning; wider filter avoids missing mixed-status scanners
#   Examples: .env, .git, .ssh, credentials.json, terraform.tfstate enumeration
#
# Tuning for your site:
#   - requests_min: total requests across the 300s window
#     * low (15): catches slower scanners, more false positives
#     * medium (20–30): recommended, catches both fast and slow scanners
#     * high (50+): only determined, multi-minute scans
#   - uri_count_min: how many unique paths = suspicious?
#     * low (10): very aggressive, catches site crawlers
#     * medium (15–20): recommended for typical sites
#     * high (30+): only rare multi-endpoint attacks
#   - window=300s (5min): good for patient reconnaissance; try 600s (10min) for slower attacks
#   - Disable: set action=detect, tune requests_min downward until you see real attacks
rule_2_name=credential_scanner
rule_2_requests_min=20
rule_2_uri_count_min=15
rule_2_status_code=3xx,4xx,5xx
rule_2_status_threshold=15
rule_2_window=300s
rule_2_action=ban
rule_2_bantime=3600

# Rule 3: Volume Spike / DDoS Catch-all (60s window)
#   Detects: unusual request volume from single IP regardless of response or URI diversity
#   Pattern: 80+ requests from single IP in 60s
#   Purpose: safety net for attack patterns not covered by rules 1-2; also catches DDoS bursts
#   Why status_code=*: DDoS attacks often return 200 (successful loads); filtering to 3xx/4xx/5xx
#     would miss volumetric attacks. Static assets (CSS, JS, images) are included intentionally.
#   Why 80 req/60s threshold: normal page load = 20-50 assets; legitimate API clients rarely
#     exceed 80 req/60s from a single IP without rate limiting
#   Why action=detect: false positives possible from CDN origin pulls, aggressive API clients,
#     monitoring tools. Tune requests_min to fit your traffic profile before enabling ban.
#
# Tuning for your site:
#   - requests_min: what is "too many" for a single IP in 60s?
#     * low (40): catches many false positives (aggressive clients)
#     * medium (80–150): recommended starting point
#     * high (200+): only severe DDoS, misses moderate attacks
#   - action recommendation: START with detect, monitor ban logs for false positives
#     * Once you understand your traffic, enable ban for selected times (off-peak testing)
#     * Then monitor production for 24h before full enable
#   - bantime=300s (5min): aggressive policies; can reduce to 60s for testing
#   - window=30s: for very high-traffic sites (more responsive, more CPU)
#   - window=300s (5min): for slower attacks (fewer evaluations, less CPU)
rule_3_name=volume_spike
rule_3_requests_min=80
rule_3_status_code=*
rule_3_window=60s
rule_3_action=detect
rule_3_bantime=300s

# ============================================================================
# CUSTOM RULES: Template for Your Own Detection Patterns
# ============================================================================
#
# Copy and paste to create new rules:
#
# rule_N_name=<unique_descriptive_name>
# rule_N_requests_min=<integer>         # total requests threshold
# rule_N_uri_count_min=<integer>        # unique paths threshold (optional, omit = no check)
# rule_N_ua_count_min=<integer>         # unique User-Agents threshold (optional, omit = no check)
# rule_N_status_code=<pattern>          # see status code patterns above (optional)
# rule_N_status_threshold=<integer>     # if status_code set, min matching requests (required with status_code)
# rule_N_window=<60s|300s|etc>          # MUST match one of webscan.windows= values
# rule_N_action=ban                     # or detect for audit mode
# rule_N_bantime=<duration>             # e.g. 60s, 5m, 1h, 24h
#
# Example: Directory brute-force on 404s only
# rule_4_name=dir_brute_force_404
# rule_4_requests_min=20
# rule_4_uri_count_min=15
# rule_4_status_code=404
# rule_4_status_threshold=20
# rule_4_window=300s
# rule_4_action=detect
# rule_4_bantime=600s
#
# Example: API misuse (high success rate but same pattern)
# rule_5_name=api_abuse_200s
# rule_5_requests_min=100
# rule_5_status_code=200
# rule_5_status_threshold=100
# rule_5_window=60s
# rule_5_action=detect
# rule_5_bantime=300s
#
# Example: Mixed errors indicating reconnaissance
# rule_6_name=auth_probe_401_403
# rule_6_requests_min=10
# rule_6_status_code=401,403
# rule_6_status_threshold=8
# rule_6_window=300s
# rule_6_action=ban
# rule_6_bantime=1800s

# ============================================================================
# WHITELIST: Per-Rule Pattern Whitelisting
# ============================================================================
#
# WebScan includes per-rule whitelisting for URIs, User-Agents, and file extensions.
# These whitelist checks happen BEFORE threshold evaluation:
#   → If URI/UA/extension matches → request is skipped, logged as SKIP_WHITELIST_URI/UA/EXT
#   → Request does NOT contribute to episode counters (requests, unique_uri, unique_ua, status_code)
#
# This is separate from the GLOBAL IP whitelist (/etc/mef/whitelist.d/).
# Both apply: first IP whitelist (global), then per-rule URI/UA/extension whitelist (local).
#
# Pattern matching: shell glob with * wildcard (same as URI files= patterns)
#   *.jpg       → matches any .jpg file (logo.jpg, image.jpg, etc)
#   /health*    → matches /health, /healthz, /health/live, /health/ready
#   *Mozilla*   → matches anything with "Mozilla" (Mozilla/5.0, Mozilla Firefox, etc)
#
# Multiple patterns: supports BOTH formats for flexibility
#   Format 1 (compact):  uri=*.jpg,*.png,*.gif        (useful for short lists)
#   Format 2 (clear):    uri=*.jpg                    (one per line, clearer for long lists)
#                        uri=*.png
#                        uri=*.gif
#   Both produce identical results. Use format that fits your workflow.
#
# Performance: matching happens per-request in O(n*patterns) time.
#   For typical configs (10-20 patterns), negligible CPU impact.
#   For very large lists (100+ patterns), consider merging into fewer specific patterns.

[whitelist]

# URI patterns: request paths to skip (before threshold evaluation)
# Use cases:
#   - Static assets: *.jpg, *.png, *.css, *.js (CDN/proxy traffic, normal load)
#   - Health checks: /health, /status, /ping (internal monitoring, load balancers)
#   - Admin dashboards: /admin*, /api/internal* (internal tools, not attacks)
#   - Excluded paths: /exclude/*, /test/* (testing, staging, internal)
#
# Examples (uncomment and customize for your site):
# uri=*.jpg
# uri=*.png
# uri=*.gif
# uri=*.css
# uri=*.js
# uri=*.woff2
# uri=*.ico
# uri=*.svg
# uri=/health
# uri=/status
# uri=/ping
# uri=/api/health
# uri=/healthz
# uri=/admin*
# uri=/internal/*

# User-Agent patterns: request user-agents to skip
# Use cases:
#   - Search engine crawlers: *Googlebot*, *Bingbot* (legitimate indexing)
#   - Site monitoring: *Nagios*, *Prometheus* (internal health checks)
#   - Browser User-Agents: *Mozilla*, *Chrome*, *Safari* (normal users)
#   - Load balancers: *ELB-HealthChecker*, *ALB-HealthChecker* (AWS)
#
# Common crawlers/tools to allow (uncomment as needed):
# ua=*Mozilla*
# ua=*Chrome*
# ua=*Safari*
# ua=*Firefox*
# ua=*Googlebot*
# ua=*Bingbot*
# ua=*DuckDuckBot*
# ua=*Slurp*
# ua=*Prometheus*
# ua=*Nagios*
# ua=*ELB-HealthChecker*
# ua=*ALB-HealthChecker*
# ua=*DataDog*

# File extensions: fast lookup for common static assets
# Use cases:
#   - Web assets: jpg, png, gif, css, js, woff2, ico (served directly, not probed)
#   - Hides from threshold: don't count 100x *.jpg requests as "high URI diversity"
#
# Format: comma-separated, no leading dot
# Note: extension matching is redundant with uri=*.jpg patterns, but faster (direct hash lookup)
#
# Uncomment and customize:
# extension=jpg,png,gif,css,js,woff2,ico,svg,txt,md,pdf,mp4,mp3

# ============================================================================
# DEPLOYMENT & TUNING GUIDELINES
# ============================================================================
#
# Step 1: BASELINE (First day)
#   1. Keep all rules in action=detect (audit mode only)
#   2. Enable this rule: enabled=true
#   3. Restart mefdaemon: systemctl restart mefdaemon
#   4. Monitor ban log (this is audit output, not actual bans yet):
#      tail -f /var/log/mef.log | grep WEBSCAN
#   5. Observe patterns for 24 hours in production traffic
#
# Step 2: ANALYSIS (Day 1 evening)
#   Run stats to see what rules triggered:
#      mefctl stats --window 24h
#   Look at ban log to understand attack patterns:
#      grep "WEBSCAN" /var/log/mef.log | tail -50
#   Check for false positives:
#      - CDN/proxy requests?
#      - Monitoring tools?
#      - Load testing?
#   If many false positives → adjust rule thresholds upward (requests_min, uri_count_min, etc)
#
# Step 3: TUNING (Before production bans)
#   For each rule generating false positives:
#     - Increase requests_min (10 → 15 → 20)
#     - Increase uri_count_min (5 → 10)
#     - Increase ua_count_min (3 → 5 → 7)
#     - Change window from 60s → 300s (slower detection, fewer FP)
#     - Change status_code filter (3xx,4xx,5xx → 4xx,5xx only)
#   After adjustments, restart and re-monitor for another 24h
#
# Step 4: ENABLE BANS (When confident)
#   Change action=detect → action=ban for high-confidence rules:
#     - rotating_crawlers: usually safe to ban (distinct UA pattern = automated)
#     - credential_scanner: safe to ban (systematic path enumeration = attack)
#     - volume_spike: START with detect, only ban if 24h monitoring shows zero FP
#   Restart mefdaemon: systemctl restart mefdaemon
#   Monitor: watch mefctl status and logs for any sudden spike in banned IPs
#
# Step 5: ONGOING (Maintenance)
#   - Review banned IPs weekly: mefctl bans list --format json | jq
#   - Check for legitimate services being banned: mefctl bans list | grep SERVICE_IP
#   - If detected: add to whitelist /etc/mef/whitelist.d/trusted.conf
#   - Monitor rule effectiveness: mefctl stats --top-sources shows attacker origins
#   - Adjust bantime based on recidivism: if same IP returns after bantime → increase duration
#
# ============================================================================
# PRODUCTION EXAMPLE: Real-World Configurations
# ============================================================================
#
# Example A: High-traffic public website (WordPress, Drupal, etc)
#   - Many legitimate crawlers (Googlebot, Bingbot, etc)
#   - High false positive risk on rotating_crawlers
#   - Recommendation: be conservative on UA count
#
# Suggested config changes:
# rule_1_requests_min=20        # increase from 10 (fewer benign bursts)
# rule_1_ua_count_min=8         # increase from 5 (only coordinated multi-UA)
# rule_1_action=ban             # ok to ban (distinct UA is automated)
# rule_2_requests_min=30        # increase from 20 (more paths = suspicious)
# rule_2_uri_count_min=20       # increase from 15
# rule_2_action=detect          # monitor first before banning
# rule_3_requests_min=150       # increase from 80 (normal load = 50-100/min)
# rule_3_action=detect          # NEVER ban this one, too many false positives
#
# Example B: API-only backend (REST API, microservices)
#   - Few legitimate bots
#   - Mostly internal + authorized clients
#   - Lower false positive risk, stricter detection
#   - Recommendation: aggressive rules, fewer false positives expected
#
# Suggested config changes:
# rule_1_action=ban             # aggressive, most attacks = automated
# rule_1_bantime=7200           # longer ban (2 hours, API clients have caching/retry logic)
# rule_2_action=ban             # aggressive
# rule_2_requests_min=15        # lower threshold (APIs = fewer distinct endpoints)
# rule_2_uri_count_min=10       # lower threshold
# rule_3_requests_min=50        # lower threshold (API calls = smaller payloads)
# rule_3_action=ban             # ok to ban in controlled environment
# rule_3_bantime=600            # shorter (5 min, easier to false positive from rate limiting)
#
# Example C: Development/staging environment
#   - Frequent testing, deployments, QA automation
#   - Many false positive sources (test suites, CI/CD)
#   - Recommendation: audit-only until deployment stabilizes
#
# Suggested config changes:
# enabled=true
# rule_1_action=detect          # audit only
# rule_2_action=detect          # audit only
# rule_3_action=detect          # audit only
# rule_1_requests_min=50        # very high threshold (reduce noise)
# rule_2_requests_min=50
# rule_3_requests_min=200
# (Then promote to production once rules stabilize and false positives clear)
#
# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#
# Q: Rule never triggers
#   A: Check enabled=true and verify regex matches your log format
#      Test: grep -E "REGEX_HERE" /var/log/nginx/access.log | head -3
#      If no matches → regex is wrong, fix capture groups
#
# Q: Too many false positives
#   A: Increase thresholds (requests_min, uri_count_min, ua_count_min)
#      Or change window to 300s (slower attacks), or switch to action=detect
#
# Q: Legitimate IPs being banned
#   A: Check if IP is in ban list: mefctl bans list | grep IP
#      Add to whitelist: echo "IP/32" >> /etc/mef/whitelist.d/exceptions.conf
#      Unban immediately: mefctl bans unban IP
#      Then adjust rule thresholds to prevent re-banning
#
# Q: High CPU usage from webscan
#   A: Too many active IPs or aggressive rule windows (60s + 300s on high traffic)
#      Solutions:
#        - Reduce windows to just 300s (fewer evaluations)
#        - Increase requests_min thresholds (fewer positives to evaluate)
#        - Increase max_active_ips (reduce eviction overhead)
#        - Reduce uri_hash_limit and ua_hash_limit (faster hashing, less memory)
#
# Q: Not seeing WebScan events in ban log
#   A: Check daemon is running: systemctl status mefdaemon
#      Verify enabled=true in this file
#      Verify rule files were loaded: grep -i webscan /var/log/syslog or journalctl -u mefdaemon
#      Check log path configured: mefctl config show | grep ban_log_path

# ============================================================================
# ESCALATION: Permanent Bans (Optional, Future)
# ============================================================================
#
# Recidive tracking (global per-IP): if same IP hits N thresholds within escalation_window,
# ban is extended to permanent_bantime (effectively permanent until manual unban).
#
# Disabled for MVP v2 (can enable when escalation tracking is implemented).
#
# escalation_enabled=false
# escalation_window=24h        # tracking window for recidive
# permanent_threshold=5        # ban permanently after 5 threshold matches in 24h
# permanent_bantime=0          # 0 = permanent (never auto-unban)

# ============================================================================
# WHITELIST: Global IP Exemptions
# ============================================================================
#
# MEF maintains a GLOBAL whitelist (not per-rule).
# Whitelisted IPs are NEVER banned by any rule, including webscan.
#
# Whitelist location: /etc/mef/whitelist.d/*.conf
# Format: one IP or CIDR per line, inline comments supported (# or ;)
#
# IMPORTANT:
#   - These are NOT configured in this rule file
#   - They are managed separately in /etc/mef/whitelist.d/
#   - Changes to whitelist files are detected automatically (no restart needed)
#
# Example whitelist entries to create/manage:
#
# /etc/mef/whitelist.d/cloudflare.conf:
#   # CloudFlare proxy IPs (prevent banning CloudFlare, which forwards real IPs upstream)
#   # See: https://www.cloudflare.com/ips/
#   173.245.48.0/20
#   103.21.244.0/22
#   103.22.200.0/22
#   ... (all CloudFlare ranges)
#
# /etc/mef/whitelist.d/local.conf:
#   # Localhost and private networks
#   127.0.0.1           # localhost (IPv4)
#   ::1                 # localhost (IPv6)
#   10.0.0.0/8          # private network
#   172.16.0.0/12       # private network
#   192.168.0.0/16      # private network
#   fc00::/7            # unique local (IPv6)
#
# /etc/mef/whitelist.d/monitoring.conf:
#   # Internal monitoring tools (prevent banning self-checks)
#   192.168.1.100       # Prometheus scraper
#   192.168.1.101       # ELK stack
#   10.0.0.5/32         # Nagios health check
#
# Management:
#   - Add whitelist entries anytime: echo "IP_OR_CIDR" >> /etc/mef/whitelist.d/custom.conf
#   - Reload (automatic, no mefdaemon restart needed)
#   - Remove from ban: mefctl bans unban IP_ADDRESS
