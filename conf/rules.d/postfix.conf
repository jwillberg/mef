[rule]
enabled=false
name=postfix

# input
# source=journal
# programs=postfix/smtpd,postfix/submission/smtpd
# programs=* # match all journal lines (disables program prefilter)
source=file
files=/var/log/mail.log,/var/log/maillog

# detection
# Examples:
# postfix/smtpd[1234]: warning: unknown[1.2.3.4]: SASL LOGIN authentication failed: authentication failure
# postfix/smtpd[1234]: warning: unknown[1.2.3.4]: SASL PLAIN authentication failed: authentication failure
failregex=postfix/smtpd\[\d+\]: warning: .*\[(?P<ip>[^\]]+)\]: SASL (LOGIN|PLAIN|CRAM-MD5|DIGEST-MD5|NTLM) authentication failed:
failregex=postfix/smtpd\[\d+\]: warning: .*\[(?P<ip>[^\]]+)\]: SASL authentication failed:
failregex=postfix/smtpd\[\d+\]: warning: .*\[(?P<ip>[^\]]+)\]: SASL .* authentication failed:
failregex=postfix/smtpd\[\d+\]: warning: .*\[(?P<ip>[^\]]+)\]: authentication failure
failregex=postfix/(?:submission/)?smtpd\[\d+\]: warning: non-SMTP command from unknown\[(?P<ip>[^\]]+)\]:
failregex=postfix/(?:submission/)?smtpd\[\d+\]: improper command pipelining after CONNECT from .*?\[(?P<ip>[^\]]+)\]:
failregex=postfix/(?:submission/)?smtpd\[\d+\]: too many errors after .* from .*?\[(?P<ip>[^\]]+)\]
ignoreregex=

# policy
findtime=600
maxretry=5
bantime=3600

# escalation (global per-IP recidive)
escalation_enabled=false
escalation_window=24h
permanent_threshold=5

# action (ban/detect)
action=ban
ports=25,465,587 # all | 25,465,587 | 25-2525 | 587

# Firewall backend:
#   auto      = prefer nft (if available), otherwise iptables
#   nftables  = force nft
#   iptables  = force iptables
backend=auto
