[rule]
enabled=false
name=exim

# input
source=file
# Generic Exim paths used by Debian/Ubuntu, DirectAdmin, and cPanel.
files=/var/log/exim4/mainlog,/var/log/exim/mainlog,/var/log/exim_mainlog

# detection
# Every failregex must extract the source IP via (?P<ip>...).
# This conservative fallback covers SMTP only and avoids platform-specific reject messages.
# Prefer exim-cpanel.conf or exim-directadmin.conf when the platform is known.
# Enable only one Exim profile: exim-cpanel, exim-directadmin, or exim.

# Generic SMTP AUTH failure. Authenticator names vary by Exim configuration.
# Only 535 Incorrect authentication data is counted; temporary 435 errors and cancelled 501 auth are excluded.
# Example:
# 2025-03-16 04:28:21 login authenticator failed for (client) [192.0.2.30]:49186: 535 Incorrect authentication data (set_id=user@example.test)
failregex=^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+\S+ authenticator failed for .*\[(?P<ip>[^\]]+)\](?::\d+)?:\s+535 Incorrect authentication data

# Clear SMTP protocol abuse after Exim has dropped the connection.
# Example:
# 2025-03-17 01:17:41 SMTP call from [192.0.2.31] dropped: too many unrecognized commands (last was "Accept-Encoding: gzip")
failregex=^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+SMTP call from \[(?P<ip>[^\]]+)\](?::\d+)? dropped: too many (?:unrecognized commands|syntax or protocol errors)
ignoreregex=

# policy
findtime=600
maxretry=5
bantime=3600

# escalation (global per-IP recidive)
escalation_enabled=false
escalation_window=24h
permanent_threshold=5

# action (ban/detect)
action=ban
ports=25,465,587

# Firewall backend:
#   auto      = prefer nft (if available), otherwise iptables
#   nftables  = force nft
#   iptables  = force iptables
backend=auto
