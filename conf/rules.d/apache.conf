[rule]
enabled=false
name=apache

# input
source=file
# Debian/Ubuntu and RHEL-family Apache access logs (supports globs)
files=/var/log/apache2/access.log,/var/log/apache2/*access.log,/var/log/httpd/access_log,/var/log/httpd/*access_log

# detection
# Every failregex must extract the source IP via (?P<ip>...).
# An optional vhost:port prefix supports Apache's other_vhosts_access.log format.
# Matchers are evaluated top-to-bottom and share this rule's findtime/maxretry counter.

# PHP probe detection
# Matches PHP file requests returning HTTP 403, 404, or 406.
# Query strings are supported.
# Example:
# 80.94.95.211 - - [17/Jul/2026:08:36:24 +0000] "GET /.env.production.php?action=scan&id=10 HTTP/1.1" 403 494 "-" "Mozilla/5.0"
failregex=^(?:\S+:\d+\s+)?(?P<ip>\S+)\s+\S+\s+\S+\s+\[[^\]]+\]\s+"\S+\s+[^"\s]*\.php(?:\?[^"\s]*)?\s+HTTP/[0-9.]+"\s+(?:403|404|406)\s+\d+\s+"[^"]*"\s+"[^"]*"

# General HTTP error detection
# Matches any request returning HTTP 444, 400, 403, 404, or 406.
# Example:
# 104.248.173.120 - - [17/Jul/2026:07:57:48 +0000] "GET /.env HTTP/1.1" 403 458 "-" "Python/3.13 aiohttp/3.14.1"
failregex=^(?:\S+:\d+\s+)?(?P<ip>\S+)\s+\S+\s+\S+\s+\[[^\]]+\]\s+"[^"]*"\s+(?:444|400|403|404|406)\s+\d+\s+"[^"]*"\s+"[^"]*"

# Static asset exclusions
# Missing or blocked images, stylesheets, scripts, source maps, and web fonts do not count as attack attempts.
# Matching is case-insensitive. The extension must end the request path but may be followed by a query string.

# Ignore image requests.
# Examples: /favicon.ico, /images/header.JPG?v=2, /assets/logo.svg
ignoreregex=(?i)"\S+\s+[^"\s?]+\.(?:avif|bmp|cur|gif|heic|heif|ico|jpe?g|jxl|png|svgz?|tiff?|webp)(?:\?[^"\s]*)?\s+HTTP/[0-9.]+"

# Ignore stylesheet, script, and source-map requests.
# Examples: /assets/site.css, /js/app.min.js?hash=abc, /js/app.js.map
ignoreregex=(?i)"\S+\s+[^"\s?]+\.(?:css|m?js|map)(?:\?[^"\s]*)?\s+HTTP/[0-9.]+"

# Ignore web-font requests.
# Examples: /fonts/site.woff2?v=4, /fonts/icons.ttf, /fonts/theme.otf
ignoreregex=(?i)"\S+\s+[^"\s?]+\.(?:eot|otf|ttf|woff2?)(?:\?[^"\s]*)?\s+HTTP/[0-9.]+"

# policy
findtime=120
maxretry=8
bantime=3600

# escalation (global per-IP recidive)
escalation_enabled=false
escalation_window=24h
permanent_threshold=5

# action (ban/detect)
action=ban
ports=80,443 # all | 80,443 | 80-8080

# Firewall backend:
#   auto      = prefer nft (if available), otherwise iptables
#   nftables  = force nft
#   iptables  = force iptables
backend=auto
