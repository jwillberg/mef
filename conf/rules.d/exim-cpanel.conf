[rule]
enabled=false
name=exim-cpanel

# input
source=file
# cPanel Exim main log
files=/var/log/exim_mainlog

# detection
# Every failregex must extract the source IP via (?P<ip>...).
# This profile covers SMTP only. Dovecot IMAP/POP authentication belongs in a separate profile.
# Enable only one Exim profile: exim-cpanel, exim-directadmin, or exim.

# SMTP AUTH failure through cPanel's dovecot_login/dovecot_plain authenticators.
# Only 535 Incorrect authentication data is counted; temporary 435 errors and cancelled 501 auth are excluded.
# Example:
# 2025-03-16 04:28:21 dovecot_login authenticator failed for (client) [192.0.2.10]:49186: 535 Incorrect authentication data (set_id=user@example.test)
failregex=^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+dovecot_(?:login|plain) authenticator failed for .*\[(?P<ip>[^\]]+)\](?::\d+)?:\s+535 Incorrect authentication data

# Invalid HELO rejected by cPanel's Exim policy.
# Example:
# 2025-03-16 04:35:50 H=(invalid-client) [192.0.2.11]:62794 rejected MAIL <sender@example.test>: Access denied - Invalid HELO name (See RFC2821 4.1.1.1)
failregex=^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+H=.*\[(?P<ip>[^\]]+)\](?::\d+)?.*rejected MAIL .*Access denied - Invalid HELO name

# Clear SMTP protocol abuse after Exim has dropped the connection.
# Example:
# 2025-03-17 01:17:41 SMTP call from [192.0.2.12] dropped: too many unrecognized commands (last was "Accept-Encoding: gzip")
failregex=^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+SMTP call from \[(?P<ip>[^\]]+)\](?::\d+)? dropped: too many (?:unrecognized commands|syntax or protocol errors)
ignoreregex=

# policy
findtime=600
maxretry=5
bantime=3600

# escalation (global per-IP recidive)
escalation_enabled=false
escalation_window=24h
permanent_threshold=5

# action (ban/detect)
action=ban
ports=25,465,587

# Firewall backend:
#   auto      = prefer nft (if available), otherwise iptables
#   nftables  = force nft
#   iptables  = force iptables
backend=auto
