[rule]
enabled=false
name=nginx

# input
source=file
# Monitor active nginx access logs (supports globs)
files=/var/log/nginx/access.log,/var/log/nginx/*.access.log

# detection
# Example:
# 157.22.44.117 - - [13/Feb/2026:18:56:12 +0000] "GET /wp-admin/ HTTP/1.1" 444 0 "https://www.google.com" "Mozilla/5.0 ..."
#
# Ban by response status code; must extract source IP via (?P<ip>...)
failregex=^(?P<ip>\S+)\s+\S+\s+\S+\s+\[[^\]]+\]\s+"[^"]*"\s+(?:444|403|404)\s+\d+\s+"[^"]*"\s+"[^"]*"
ignoreregex=

# policy
findtime=120
maxretry=8
bantime=3600

# escalation (global per-IP recidive)
escalation_enabled=false
escalation_window=24h
permanent_threshold=5

# action (ban/detect)
action=ban
ports=80,443 # all | 80,443 | 80-8080

# Firewall backend:
#   auto      = prefer nft (if available), otherwise iptables
#   nftables  = force nft
#   iptables  = force iptables
backend=auto
