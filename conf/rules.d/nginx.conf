[rule]
# enabled: true to activate this rule, false to disable (default: false)
enabled=false
name=nginx

# input: source type (options: file, journal)
# - file: read from log files (uses tail -F, supports glob patterns)
# - journal: read from systemd journal (filter by programs=apache2,httpd,sshd*)
source=file

# files: log file paths (supports globs + multi-line/comma-separated)
# Patterns:
#   /var/log/service.log         (single file)
#   /var/log/*.log               (glob: all .log files in directory)
#   /var/log/*/current.log       (glob: per-instance files)
# Formats:
#   files=/var/log/file1,/var/log/file2   (comma-separated)
#   files=/var/log/file1                  (multi-line)
#   files=/var/log/file2

# Monitor active nginx access logs (supports globs)
files=/var/log/nginx/access.log,/var/log/nginx/*.access.log

# detection
# Every failregex must extract the source IP via (?P<ip>...).
# Matchers are evaluated top-to-bottom and share this rule's findtime/maxretry counter.

# PHP probe detection
# Matches PHP file requests returning HTTP 403, 404, or 406.
# Query strings are supported.
# Example:
# 20.48.236.161 - - [17/Jul/2026:07:12:50 +0300] "GET ///admin.php?action=scan&id=10 HTTP/1.1" 404 3445 "-" "-"
failregex=^(?P<ip>\S+)\s+\S+\s+\S+\s+\[[^\]]+\]\s+"\S+\s+[^"\s]*\.php(?:\?[^"\s]*)?\s+HTTP/[0-9.]+"\s+(?:403|404|406)\s+\d+\s+"[^"]*"\s+"[^"]*"

# General HTTP error detection
# Matches any request returning HTTP 444, 403, 404, or 406.
# Example:
# 157.22.44.117 - - [13/Feb/2026:18:56:12 +0000] "GET /wp-admin/ HTTP/1.1" 444 0 "https://www.google.com" "Mozilla/5.0 ..."
failregex=^(?P<ip>\S+)\s+\S+\s+\S+\s+\[[^\]]+\]\s+"[^"]*"\s+(?:444|403|404|406)\s+\d+\s+"[^"]*"\s+"[^"]*"

# Static asset exclusions
# Missing or blocked images, stylesheets, scripts, source maps, and web fonts do not count as attack attempts.
# Matching is case-insensitive. The extension must end the request path but may be followed by a query string.

# Ignore image requests.
# Examples: /favicon.ico, /images/header.JPG?v=2, /assets/logo.svg
ignoreregex=(?i)"\S+\s+[^"\s?]+\.(?:avif|bmp|cur|gif|heic|heif|ico|jpe?g|jxl|png|svgz?|tiff?|webp)(?:\?[^"\s]*)?\s+HTTP/[0-9.]+"

# Ignore stylesheet, script, and source-map requests.
# Examples: /assets/site.css, /js/app.min.js?hash=abc, /js/app.js.map
ignoreregex=(?i)"\S+\s+[^"\s?]+\.(?:css|m?js|map)(?:\?[^"\s]*)?\s+HTTP/[0-9.]+"

# Ignore web-font requests.
# Examples: /fonts/site.woff2?v=4, /fonts/icons.ttf, /fonts/theme.otf
ignoreregex=(?i)"\S+\s+[^"\s?]+\.(?:eot|otf|ttf|woff2?)(?:\?[^"\s]*)?\s+HTTP/[0-9.]+"

# policy
findtime=120
maxretry=8
bantime=3600

# escalation (global per-IP recidive)
escalation_enabled=false
escalation_window=24h
permanent_threshold=5

# action (ban/detect)
action=ban
ports=80,443 # all | 80,443 | 80-8080

# Firewall backend:
#   auto      = prefer nft (if available), otherwise iptables
#   nftables  = force nft
#   iptables  = force iptables
backend=auto
