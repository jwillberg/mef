[rule]
# enabled: true to activate this rule, false to disable (default: false)
enabled=true
name=sshd

# input: source type (options: file, journal)
# - file: read from log files (uses tail -F, supports glob patterns)
# - journal: read from systemd journal (filter by programs=apache2,httpd,sshd*)
source=journal
programs=sshd*
# programs=* # match all journal lines (disables program prefilter)

# files: log file paths (supports globs + multi-line/comma-separated)
# Patterns:
#   /var/log/service.log         (single file)
#   /var/log/*.log               (glob: all .log files in directory)
#   /var/log/*/current.log       (glob: per-instance files)
# Formats:
#   files=/var/log/file1,/var/log/file2   (comma-separated)
#   files=/var/log/file1                  (multi-line)
#   files=/var/log/file2
# source=file
# files=/var/log/auth.log,/var/log/secure

# detection
failregex=Failed password .* from (?P<ip>\S+)
failregex=Invalid user .* from (?P<ip>\S+)
ignoreregex=

# policy
findtime=600
maxretry=5
bantime=3600

# escalation (global per-IP recidive)
escalation_enabled=false
escalation_window=24h
permanent_threshold=5

# action (ban/detect)
action=ban
ports=all # all | 22,25 | 22-2222 | 8080

# Firewall backend:
#   auto      = prefer nft (if available), otherwise iptables
#   nftables  = force nft
#   iptables  = force iptables
backend=auto
