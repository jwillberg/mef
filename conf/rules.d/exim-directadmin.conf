[rule]
enabled=false
name=exim-directadmin

# input
source=file
# DirectAdmin Exim main log
files=/var/log/exim/mainlog

# detection
# Every failregex must extract the source IP via (?P<ip>...).
# This profile covers SMTP only. IMAP/POP authentication belongs in a separate Dovecot profile.
# Enable only one Exim profile: exim-cpanel, exim-directadmin, or exim.

# SMTP AUTH failure through DirectAdmin's login/plain authenticators.
# Only 535 Incorrect authentication data is counted.
# Example:
# 2025-03-16 03:14:09 login authenticator failed for (client) [192.0.2.20]: 535 Incorrect authentication data (set_id=user@example.test)
failregex=^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+(?:login|plain) authenticator failed for .*\[(?P<ip>[^\]]+)\](?::\d+)?:\s+535 Incorrect authentication data

# Invalid HELO rejected by a DirectAdmin Exim policy.
# Example:
# 2025-03-16 13:26:07 H=client.example (localhost) [192.0.2.21] F=<sender@example.test> rejected RCPT <user@example.test>: R1: HELO should be a FQDN or address literal (See RFC 2821 4.1.1.1)
failregex=^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+H=.*\[(?P<ip>[^\]]+)\](?::\d+)?.*rejected RCPT .*HELO should be a FQDN or address literal

# Clear SMTP protocol abuse after Exim has dropped the connection.
# Example:
# 2025-03-17 14:57:13 SMTP call from [192.0.2.22] dropped: too many syntax or protocol errors (last command was "invalid", NULL)
failregex=^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+SMTP call from \[(?P<ip>[^\]]+)\](?::\d+)? dropped: too many (?:unrecognized commands|syntax or protocol errors)
ignoreregex=

# policy
findtime=600
maxretry=5
bantime=3600

# escalation (global per-IP recidive)
escalation_enabled=false
escalation_window=24h
permanent_threshold=5

# action (ban/detect)
action=ban
ports=25,465,587

# Firewall backend:
#   auto      = prefer nft (if available), otherwise iptables
#   nftables  = force nft
#   iptables  = force iptables
backend=auto
